[package]
name = "tokeye"
version = "0.2.0"
description = "Tokeye - a cute, customizable token & cost monitor for AI coding tools"
edition = "2021"
default-run = "tokeye"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "custom-protocol"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
cairo-rs = "0.18"

[profile.release]
strip = true
codegen-units = 16
