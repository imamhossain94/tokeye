<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tokeye menu</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="menu">
  <div id="box">
    <div class="m-head">
      <div class="m-eyes" id="eyes"></div>
      <div><b id="today">$0.00</b><div class="m-sub" id="sub">today</div></div>
    </div>
    <div class="m-sep"></div>
    <div class="m-title">Show</div>
    <label class="m-item"><span class="ic">◠</span><span class="grow">Notch island</span><span class="switch"><input type="checkbox" data-k="show_notch" /><span></span></span></label>
    <label class="m-item"><span class="ic">◉</span><span class="grow">Floating bubble</span><span class="switch"><input type="checkbox" data-k="show_floating" /><span></span></span></label>
    <label class="m-item"><span class="ic">▣</span><span class="grow">Desktop widget</span><span class="switch"><input type="checkbox" data-k="show_widget" /><span></span></span></label>
    <label class="m-item"><span class="ic">▭</span><span class="grow">Taskbar strip</span><span class="switch"><input type="checkbox" data-k="show_taskbar" /><span></span></span></label>
    <label class="m-item"><span class="ic">👀</span><span class="grow">Eyes companion</span><span class="switch"><input type="checkbox" data-k="companion" /><span></span></span></label>
    <label class="m-item"><span class="ic">◌</span><span class="grow">Click-through bubble &amp; widget</span><span class="switch"><input type="checkbox" id="ghost" /><span></span></span></label>
    <div class="m-sep"></div>
    <label class="m-item"><span class="ic">⏻</span><span class="grow" id="autoLabel">Start with Windows</span><span class="switch"><input type="checkbox" data-k="autostart" /><span></span></span></label>
    <div class="m-item" data-act="limits"><span class="ic">⚑</span><span class="grow">Limits &amp; warnings…</span><span class="k" id="limitK"></span></div>
    <div class="m-item" data-act="dash"><span class="ic">▤</span><span class="grow">Open dashboard</span></div>
    <div class="m-item" data-act="settings"><span class="ic">⚙</span><span class="grow">Settings</span></div>
    <div class="m-sep"></div>
    <div class="m-item danger" data-act="quit"><span class="ic">✕</span><span class="grow">Quit Tokeye</span></div>
  </div>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
